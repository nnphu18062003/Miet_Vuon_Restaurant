server {
    listen 80;
    listen [::]:80;
    server_name mietvuon.lunix.codes www.mietvuon.lunix.codes;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mietvuon.lunix.codes www.mietvuon.lunix.codes;

    # SSL Certificates (will be generated by Certbot)
    ssl_certificate /etc/letsencrypt/live/mietvuon.lunix.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mietvuon.lunix.codes/privkey.pem;

    # Proxy to Node.js App
    location / {
        proxy_pass http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
